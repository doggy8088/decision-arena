# 只把 HTML 報告、首頁、robots.txt 與 CNAME 部署到 GitHub Pages。
# repo 是私人的，但 Pages 網站是公開的，所以刻意不部署原始資料與程式碼。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 組出網站內容
        run: |
          mkdir -p _site
          cp pages/index.html pages/robots.txt pages/CNAME _site/
          cp bench-dashboard.html bench-report.html report.html audit-report.html ms-decision-report.html _site/
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

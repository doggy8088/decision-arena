<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini Decisions 1 能力實測 · 互動報告</title>
<style>
:root{
  --bg:#0b0e13; --bg2:#0f141b; --card:#141a22; --card2:#182029;
  --line:#242e3a; --line2:#2f3b4a;
  --ink:#e8e6e2; --ink-2:#98a3b2; --ink-3:#6b7683;
  --acc:#2dd4bf; --acc-2:#f5b942; --bad:#f87171; --good:#4ade80; --warn:#fbbf24;
  --glow:rgba(45,212,191,.16);
  --shadow:0 24px 60px -32px rgba(0,0,0,.9);
  --radius:20px;
}
html[data-theme="light"]{
  --bg:#f6f4ef; --bg2:#efece5; --card:#ffffff; --card2:#fbfaf7;
  --line:#e2dcd2; --line2:#d3cbc0;
  --ink:#1b1a18; --ink-2:#5d5850; --ink-3:#8a8377;
  --acc:#0d7a6f; --acc-2:#b45309; --bad:#b91c1c; --good:#15803d; --warn:#a16207;
  --glow:rgba(13,122,111,.10);
  --shadow:0 20px 50px -30px rgba(60,50,30,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.85 -apple-system,"SF Pro TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .4s ease,color .4s ease;
}
::selection{background:var(--acc);color:#04120f}
a{color:var(--acc);text-decoration:none}
code{
  font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.84em;
  background:rgba(127,127,127,.12); padding:.12em .42em; border-radius:6px;
  border:1px solid var(--line);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- progress + nav ---------- */
.progress{position:fixed;inset:0 0 auto 0;height:2px;background:transparent;z-index:80}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc-2));box-shadow:0 0 12px var(--acc)}
nav.topbar{
  position:sticky;top:0;z-index:70;backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid var(--line);
}
nav.topbar .inner{max-width:1080px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px}
nav .brand{font-weight:700;font-size:14px;letter-spacing:.02em;white-space:nowrap}
nav .brand span{color:var(--acc)}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav ul::-webkit-scrollbar{display:none}
nav a{
  color:var(--ink-2);font-size:13px;padding:6px 11px;border-radius:99px;white-space:nowrap;
  transition:.2s;display:block
}
nav a:hover{color:var(--ink);background:var(--card)}
nav a.on{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line2)}
.theme{
  margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.2s
}
.theme:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- hero ---------- */
header.hero{position:relative;overflow:hidden;padding:88px 0 64px;border-bottom:1px solid var(--line)}
header.hero::before{
  content:"";position:absolute;inset:-40% -10% auto -10%;height:140%;
  background:
    radial-gradient(46% 42% at 18% 22%, var(--glow), transparent 70%),
    radial-gradient(38% 38% at 84% 12%, rgba(245,185,66,.13), transparent 72%),
    radial-gradient(50% 50% at 60% 90%, rgba(248,113,113,.08), transparent 70%);
  filter:blur(10px);pointer-events:none
}
header.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
  background-size:32px 32px;
  mask-image:radial-gradient(70% 60% at 50% 40%, #000 20%, transparent 75%);
}
.hero .wrap{position:relative;z-index:2}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line2);
  padding:5px 13px;border-radius:99px;background:var(--card)
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
h1{
  font-size:clamp(34px,5.6vw,62px);line-height:1.12;letter-spacing:-.025em;margin:22px 0 0;
  font-weight:800
}
h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--acc),#7dd3fc 45%,var(--acc-2));
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.lede{font-size:18.5px;color:var(--ink-2);max-width:730px;margin:20px 0 0;line-height:1.85}
.lede b{color:var(--ink);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:44px}
.kpi{
  background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow)
}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--acc)}
.kpi.bad::before{background:var(--bad)}
.kpi.warn::before{background:var(--acc-2)}
.kpi .v{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-2);margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:8px;font-family:ui-monospace,Menlo,monospace}

/* ---------- sections ---------- */
main{padding-bottom:40px}
section{padding:76px 0 12px;position:relative}
.sec-head{margin-bottom:34px}
.sec-no{
  font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.18em;
  color:var(--acc);display:flex;align-items:center;gap:10px;margin-bottom:10px
}
.sec-no::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line2),transparent)}
h2{font-size:clamp(25px,3.4vw,36px);line-height:1.25;letter-spacing:-.02em;margin:0;font-weight:800}
.sec-head p{color:var(--ink-2);max-width:760px;margin:12px 0 0;font-size:15.5px}

.card{
  background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow)
}
.card + .card{margin-top:16px}
.card h3{margin:0 0 4px;font-size:16.5px;font-weight:700}
.card .hint{color:var(--ink-3);font-size:13px;margin:0 0 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 > .card{margin-top:0}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}

/* ---------- capability bars ---------- */
.cap{display:flex;flex-direction:column;gap:2px}
.cap-row{
  display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center;
  padding:11px 0;border-bottom:1px dashed var(--line)
}
.cap-row:last-child{border-bottom:0}
.cap-row .name{font-size:14.5px;font-weight:600}
.cap-row .name small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:10px;cursor:default}
.bar .track{display:block;flex:1;height:9px;border-radius:99px;background:rgba(127,127,127,.14);overflow:hidden}
.bar .fill{display:block;height:100%;width:var(--w,100%);border-radius:99px}
.bar.d .fill{background:linear-gradient(90deg,var(--acc),#5eead4)}
.bar.a .fill{background:linear-gradient(90deg,var(--acc-2),#fcd34d)}
.bar .tag{font-size:11px;color:var(--ink-3);width:14px;font-family:ui-monospace,Menlo,monospace}
.bar .val{font-size:12.5px;width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar:hover .val{color:var(--ink)}

/* ---------- dot strip ---------- */
.strip{position:relative;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:82px 1fr;gap:14px;align-items:center}
.lane .lb{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.3}
.lane .track{position:relative;height:42px}
.lane .track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.lane .track::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 25%);
  opacity:.5
}
.dot{
  position:absolute;top:50%;width:15px;height:15px;border-radius:50%;
  transform:translate(-50%,-50%);cursor:pointer;transition:transform .18s,box-shadow .18s;
  z-index:2
}
.dot:hover{transform:translate(-50%,-50%) scale(1.45);box-shadow:0 0 0 4px rgba(127,127,127,.18)}
.axis{margin-left:96px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;margin-top:6px}

/* ---------- matrix ---------- */
.mx{display:grid;grid-template-columns:92px repeat(7,1fr);gap:4px;font-size:11.5px}
.mx .cell{
  aspect-ratio:1.45;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;font-weight:600;cursor:pointer;
  border:1px solid transparent;transition:.15s;position:relative
}
.mx .cell:hover{outline:2px solid var(--ink-2);outline-offset:1px;z-index:2}
.mx .cell.empty{color:var(--ink-3);font-weight:400}
.mx .hdr{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:10.5px;text-align:center;line-height:1.25;padding:2px}
.mx .hdr.rowh{justify-content:flex-end;text-align:right}
.mx .diag{box-shadow:inset 0 0 0 1.5px var(--acc)}
.seg{display:inline-flex;background:rgba(127,127,127,.12);border-radius:11px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;
  padding:6px 14px;border-radius:8px;cursor:pointer;transition:.2s
}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.detail{
  margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;
  font-size:13px;color:var(--ink-2);min-height:52px
}
.detail b{color:var(--ink)}

/* ---------- clip explorer ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chip{
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:5px 13px;border-radius:99px;cursor:pointer;transition:.18s
}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.clips{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow:auto;padding-right:4px}
.clips::-webkit-scrollbar{width:6px}
.clips::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.clip{
  display:grid;grid-template-columns:88px 1fr 108px 108px;gap:12px;align-items:center;
  padding:9px 12px;border-radius:10px;font-size:13px;transition:.15s
}
.clip:hover{background:rgba(127,127,127,.07)}
.clip .cat{font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.clip .t{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;text-align:center;
  border:1px solid transparent;white-space:nowrap
}
.pill.ok{background:rgba(74,222,128,.13);color:var(--good);border-color:rgba(74,222,128,.28)}
.pill.no{background:rgba(248,113,113,.13);color:var(--bad);border-color:rgba(248,113,113,.3)}

/* ---------- variant bars ---------- */
.vrows{display:flex;flex-direction:column;gap:14px}
.vrow{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center}
.vrow .n{font-size:13.5px}
.vrow .n small{display:block;color:var(--ink-3);font-size:11px}
.vbars{display:flex;flex-direction:column;gap:5px}
.vbar{display:flex;align-items:center;gap:8px}
.vbar .tr{display:block;flex:1;height:7px;border-radius:99px;background:rgba(127,127,127,.14);overflow:hidden}
.vbar .fl{display:block;height:100%;width:var(--w,100%);border-radius:99px}
.vbar.p .fl{background:var(--acc)}
.vbar.q .fl{background:var(--acc-2)}
.vbar .num{width:44px;text-align:right;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- traps ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{
  border:1px solid var(--line);background:transparent;color:var(--ink-2);font:inherit;
  font-size:13px;padding:8px 16px;border-radius:11px;cursor:pointer;transition:.2s
}
.tab.on{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:var(--shadow)}
.tab .idx{color:var(--acc);font-family:ui-monospace,Menlo,monospace;margin-right:7px;font-size:11px}
.trap{display:none}
.trap.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--ink-3);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
tbody tr:hover{background:rgba(127,127,127,.05)}
td .num{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
.bad-t{color:var(--bad);font-weight:700}
.good-t{color:var(--good);font-weight:700}

/* ---------- callout ---------- */
.callout{
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:0 14px 14px 0;
  background:linear-gradient(90deg,var(--glow),transparent 60%);
  padding:18px 22px;margin:22px 0;font-size:14.5px;color:var(--ink-2)
}
.callout b{color:var(--ink)}
.callout.warn{border-left-color:var(--acc-2);background:linear-gradient(90deg,rgba(245,185,66,.12),transparent 60%)}
.callout.bad{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(248,113,113,.1),transparent 60%)}

/* ---------- guide ---------- */
.guide{display:grid;grid-template-columns:260px 1fr;gap:18px}
@media(max-width:820px){.guide{grid-template-columns:1fr}}
.glist{display:flex;flex-direction:column;gap:6px}
.gitem{
  border:1px solid var(--line);background:transparent;color:var(--ink-2);font:inherit;text-align:left;
  padding:12px 15px;border-radius:12px;cursor:pointer;transition:.18s;font-size:13.5px
}
.gitem:hover{border-color:var(--line2);color:var(--ink)}
.gitem.on{background:var(--card);border-color:var(--acc);color:var(--ink)}
.gitem small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.gpanel{border:1px solid var(--line);border-radius:16px;padding:24px 26px;background:var(--card);min-height:230px}
.gpanel .verdict{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:2px 0 10px}
.gpanel .why{color:var(--ink-2);font-size:14px}
.gpills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.gpills .pill{font-size:12px;padding:5px 12px}
.gstat{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.gstat div{font-size:12px;color:var(--ink-3)}
.gstat div b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- cost ---------- */
.costbar{display:flex;height:44px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
.costbar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#04120f}
.costbar .a{background:linear-gradient(90deg,var(--acc-2),#fcd34d)}
.costbar .d{background:linear-gradient(90deg,var(--acc),#5eead4)}
.legend{display:flex;gap:18px;margin-top:12px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* ---------- misc ---------- */
.reveal{opacity:1;transform:none}
.reveal.anim{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal.anim{opacity:1!important;transform:none!important}
}
.reveal.anim.in{opacity:1;transform:none}
footer{border-top:1px solid var(--line);padding:44px 0 70px;color:var(--ink-3);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
#tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .15s;
  background:var(--card);border:1px solid var(--line2);border-radius:10px;
  padding:9px 12px;font-size:12.5px;box-shadow:var(--shadow);max-width:280px;line-height:1.55
}
#tip b{color:var(--acc)}
@media(max-width:680px){
  .wrap{padding:0 16px}
  header.hero{padding:56px 0 44px}
  .cap-row{grid-template-columns:1fr;gap:8px}
  .cap-row .name{font-size:13.5px}
  .vrow{grid-template-columns:1fr;gap:8px}
  .lane{grid-template-columns:62px 1fr;gap:8px}
  .axis{margin-left:70px}
  .clip{grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 12px}
  .clip .cat{grid-column:1/-1}
  .clip .t{grid-column:1/-1;white-space:normal}
  .mx{grid-template-columns:56px repeat(7,1fr);font-size:9.5px;gap:3px}
  .mx .cell{aspect-ratio:1;border-radius:5px}
  .mx .hdr{font-size:8.5px}
  .guide{grid-template-columns:1fr}
  .gpanel{padding:18px}
  .gpanel .verdict{font-size:21px}
  .costbar{height:38px}
  table{font-size:12px}
  th,td{padding:8px 8px}
  .card{padding:20px 18px}
}
@media print{
  nav,.progress,.theme,#tip{display:none}
  body{background:#fff;color:#111}
  section{page-break-inside:avoid}
  .reveal.anim{opacity:1!important;transform:none!important}
  .card{box-shadow:none;border-color:#ddd;background:#fff}
}
</style>
</head>

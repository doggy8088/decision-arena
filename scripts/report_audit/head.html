<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注音音檔稽核 · gemini-3.1-flash-lite</title>
<style>
:root{
  --paper:#f8f5ef; --card:#fffdf9; --ink:#1b1815; --ink2:#6b6357; --ink3:#948a7b;
  --rule:#e4ddd1; --rule2:#d3c9b8;
  --rust:#a8431a; --moss:#2f6f5e; --amber:#a9761a;
  --rust-bg:rgba(168,67,26,.09); --moss-bg:rgba(47,111,94,.10);
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,"SF Pro TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
html[data-theme="dark"]{
  --paper:#141210; --card:#1b1815; --ink:#ece7de; --ink2:#a89e8f; --ink3:#7d7365;
  --rule:#2e2922; --rule2:#3d362d;
  --rust:#e07a4b; --moss:#63b79b; --amber:#d6a03c;
  --rust-bg:rgba(224,122,75,.12); --moss-bg:rgba(99,183,155,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.85 var(--sans);-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
::selection{background:var(--rust);color:#fff}
.wrap{max-width:1020px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:.86em;background:rgba(127,120,105,.10);
     padding:.08em .38em;border-radius:3px;border:1px solid var(--rule);white-space:nowrap}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}

/* ---------- 進度與導覽 ---------- */
.bar-progress{position:fixed;top:0;left:0;height:2px;background:var(--rust);width:0;z-index:60}
nav{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);
}
nav .inner{max-width:1020px;margin:0 auto;padding:11px 28px;display:flex;align-items:center;gap:22px}
nav .mark{font:600 13px/1 var(--sans);letter-spacing:.02em;white-space:nowrap}
nav .mark b{color:var(--rust);font-weight:700}
nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav ul::-webkit-scrollbar{display:none}
nav a{font-size:12.5px;color:var(--ink2);text-decoration:none;padding:5px 10px;border-radius:6px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--card)}
nav a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--rust)}
.theme{
  margin-left:auto;background:none;border:1px solid var(--rule2);color:var(--ink2);
  font:inherit;font-size:12px;padding:5px 11px;border-radius:99px;cursor:pointer;white-space:nowrap
}
.theme:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- 封面 ---------- */
header{padding:92px 0 0;border-bottom:1px solid var(--rule)}
.kicker{
  display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.20em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:26px
}
.kicker::after{content:"";flex:1;height:1px;background:var(--rule)}
h1{
  font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.14;
  font-size:clamp(34px,5.2vw,58px);margin:0 0 8px
}
h1 em{font-style:normal;color:var(--rust)}
.standfirst{
  font-size:19px;line-height:1.8;color:var(--ink2);max-width:680px;margin:22px 0 0
}
.standfirst b{color:var(--ink);font-weight:600}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:52px 0 0;
  border-top:1px solid var(--rule)
}
.stat{padding:22px 26px 26px 0;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat .v small{font-size:16px;color:var(--ink3);font-weight:400;margin-left:2px}
.stat .v .cur{font-size:17px;color:var(--ink3);font-weight:400;margin-right:2px;letter-spacing:.02em}
.stat .k{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;margin-top:6px}
.stat .s{font-size:12px;color:var(--ink3);margin-top:2px}
.stat.bad .v{color:var(--rust)}

/* ---------- 區塊 ---------- */
main{padding:0 0 40px}
section{padding:80px 0 0}
.sec-label{
  font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:var(--rust);
  display:flex;align-items:center;gap:12px;margin-bottom:14px
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--rule)}
h2{
  font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.3;
  font-size:clamp(24px,3.2vw,32px);margin:0 0 14px
}
.lead{color:var(--ink2);max-width:720px;font-size:16px;margin:0 0 34px}
h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
   font-weight:600;margin:0 0 14px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:30px 32px;margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px;align-items:start}
.grid2 .card{margin-top:0}

/* ---------- 堆疊條 ---------- */
.stack{display:flex;height:58px;border-radius:3px;overflow:hidden;margin:6px 0 0;border:1px solid var(--rule)}
.stack div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
  color:#fff;transition:flex .4s;white-space:nowrap;overflow:hidden}
.stack .ok{background:var(--moss)}
.stack .tone{background:var(--amber)}
.stack .syllable{background:var(--rust)}
.stack .err{background:var(--ink3)}
.stack-key{display:flex;flex-wrap:wrap;gap:22px;margin-top:16px;font-size:12.5px;color:var(--ink2)}
.stack-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}

/* ---------- 聲調列 ---------- */
.tone-row{display:grid;grid-template-columns:76px 1fr 74px;gap:16px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--rule)}
.tone-row:last-child{border-bottom:0}
.tone-row .tl{font-family:var(--serif);font-size:17px}
.tone-row .tl small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3);letter-spacing:.04em}
.tbar{height:9px;background:var(--rule);border-radius:99px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--moss);border-radius:99px}
.tbar span.low{background:var(--rust)}
.tbar span.mid{background:var(--amber)}
.tone-row .tp{text-align:right;font-size:15px;font-variant-numeric:tabular-nums}
.tone-note{font-size:12px;color:var(--ink3);margin-top:3px}

/* ---------- 混淆矩陣 ---------- */
.mx{display:grid;grid-template-columns:104px repeat(5,1fr);gap:5px;margin-top:4px}
.mx .h{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);
  letter-spacing:.06em;padding:4px}
.mx .h.row{justify-content:flex-end}
.mx .c{aspect-ratio:2.1;display:flex;align-items:center;justify-content:center;border-radius:3px;
  font-size:14px;font-variant-numeric:tabular-nums;cursor:default;transition:.15s}
.mx .c:hover{outline:1.5px solid var(--ink3)}
.mx .c.diag{box-shadow:inset 0 0 0 1.5px var(--moss)}
.mx .c.zero{color:var(--ink3);background:transparent!important;box-shadow:none}

/* ---------- 錯誤型態 ---------- */
.type-row{display:grid;grid-template-columns:230px 1fr 86px;gap:16px;align-items:center;padding:10px 0}
.type-row .tn{font-size:14px}
.tybar{height:8px;background:var(--rule);border-radius:99px;overflow:hidden}
.tybar span{display:block;height:100%;background:var(--rust);border-radius:99px}
.type-row .tv{text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);
   text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--rule2);font-weight:600}
td{padding:9px 12px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--rust-bg)}
td.file{font-family:var(--mono);font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600}
.tag.tone{background:rgba(169,118,26,.14);color:var(--amber)}
.tag.syllable{background:var(--rust-bg);color:var(--rust)}
.tag.ok{background:var(--moss-bg);color:var(--moss)}
.tag.bad{background:var(--rust-bg);color:var(--rust)}

/* ---------- 仲裁 ---------- */
.split{display:flex;height:54px;border-radius:3px;overflow:hidden;border:1px solid var(--rule)}
.split div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
.split .a{background:var(--rust)}
.split .b{background:var(--moss)}

/* ---------- 清單工具列 ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 16px}
.search{
  flex:1;min-width:190px;background:var(--card);border:1px solid var(--rule2);border-radius:4px;
  padding:9px 13px;font:inherit;font-size:13.5px;color:var(--ink)
}
.search:focus{outline:none;border-color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--rule2);color:var(--ink2);
  font:inherit;font-size:12.5px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.btn{background:none;border:1px solid var(--rule2);border-radius:4px;color:var(--ink2);
  font:inherit;font-size:12.5px;padding:8px 13px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--ink3)}
.tbl-wrap{max-height:620px;overflow:auto;border:1px solid var(--rule);border-radius:4px;background:var(--card)}
.tbl-wrap thead th{position:sticky;top:0;background:var(--card);padding-top:12px;z-index:2;cursor:pointer;user-select:none}
.tbl-wrap thead th:hover{color:var(--ink)}
.count{font-size:12.5px;color:var(--ink3);margin-top:10px}
mark{background:rgba(168,67,26,.22);color:inherit;padding:0 2px;border-radius:2px}

/* ---------- 成本 ---------- */
.cost-table td:last-child,.cost-table th:last-child{text-align:right}
.callout{
  border-left:2px solid var(--rust);background:var(--rust-bg);padding:18px 22px;margin-top:24px;
  font-size:14.5px;color:var(--ink2);border-radius:0 4px 4px 0
}
.callout b{color:var(--ink)}
.callout.moss{border-left-color:var(--moss);background:var(--moss-bg)}

ul.plain{padding-left:0;list-style:none;margin:0}
ul.plain li{padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--rule);font-size:14.5px;color:var(--ink2)}
ul.plain li:last-child{border-bottom:0}
ul.plain li::before{content:"—";position:absolute;left:0;color:var(--rust)}
ul.plain li b{color:var(--ink)}

footer{margin-top:90px;border-top:1px solid var(--rule);padding:34px 0 60px;color:var(--ink3);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media(max-width:760px){
  .wrap{padding:0 18px}
  nav .inner{padding:10px 18px;gap:12px}
  header{padding-top:56px}
  .stats{grid-template-columns:1fr 1fr}
  .stat{border-right:0;border-bottom:1px solid var(--rule);padding:18px 0}
  .stat:nth-child(odd){border-right:1px solid var(--rule);padding-right:18px}
  .grid2{grid-template-columns:1fr}
  .card{padding:22px 18px}
  .mx{grid-template-columns:66px repeat(5,1fr);gap:3px}
  .mx .c{font-size:11px}
  .tone-row{grid-template-columns:64px 1fr 60px;gap:10px}
  .type-row{grid-template-columns:1fr;gap:6px}
  .type-row .tv{text-align:left}
  section{padding-top:56px}
}
@media print{
  nav,.bar-progress,.theme,.tools{display:none}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#ddd}
  .tbl-wrap{max-height:none;overflow:visible}
}
</style>
</head>
